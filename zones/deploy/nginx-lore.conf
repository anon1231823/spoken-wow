# nginx vhost for the ZoneLore voiceline explorer.
#
# Get the certificate first, then install this file - in that order, because nginx will
# not start if it references a certificate that does not exist yet:
#   sudo certbot certonly --nginx -d lore.rusty.one
#   sudo cp deploy/nginx-lore.conf /etc/nginx/sites-available/zonelore
#   sudo ln -s /etc/nginx/sites-available/zonelore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Use `certonly`, not `certbot --nginx`: the installer picks the server block it thinks
# matches, and a wildcard `*.rusty.one` block elsewhere in the config will win over a
# vhost like this one. It then writes the certificate into that block and leaves this file
# without TLS at all.
#
# Upstream is 127.0.0.1:3001. voiceover.rusty.one holds 3000 on this droplet.

server {
    listen 80;
    listen [::]:80;
    server_name lore.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    # `listen ... ssl http2` rather than the `http2 on` directive: this targets nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lore.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/lore.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/lore.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lore.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zonelore.access.log;
    error_log  /var/log/nginx/zonelore.error.log;

    # ---------------------------------------------------------------------------------
    # THE SITE IS OPEN. The explorer has no accounts and no authorization: POST
    # /api/regenerate spends real ElevenLabs credits, POST /api/lexicon rewrites the
    # pronunciation rules, and POST /api/flags edits the review state - for anyone who
    # finds the hostname.
    #
    # To close it, on the droplet:
    #
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-zonelore <you>
    #
    # then uncomment the two lines in each location block below and reload. `satisfy` and
    # per-location placement are not needed - the same two lines in all three blocks is
    # the whole change. Audio needs them too, or every clip is public.
    # ---------------------------------------------------------------------------------

    # The audio store, split out from / because streaming needs different handling.
    # The app answers Range itself (web/src/lib/stream.ts) and nginx forwards the header
    # untouched, so everything here exists to keep that response byte-exact: Safari opens
    # audio with `Range: bytes=0-1` and refuses a resource that answers 200.
    location /api/audio/ {
        # auth_basic "zonelore";
        # auth_basic_user_file /etc/nginx/.htpasswd-zonelore;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Stream straight through. With buffering on, nginx accumulates the upstream
        # response (spilling to disk past proxy_buffers) before answering, which adds
        # latency to every seek and churns disk for a ~700 MB store.
        proxy_buffering off;
        proxy_request_buffering off;

        # Never gzip mp3: it is already compressed, so this is pure CPU. It would also put
        # nginx in the business of rewriting a body the Range headers describe.
        gzip off;

        # A cache that is not Range-aware serves truncated audio, so make sure a globally
        # configured proxy_cache does not apply here.
        proxy_cache off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Regeneration calls ElevenLabs from inside the request for a single line, and a
    # batch's first response waits on the rate measurement. Both outlast the 60s the /
    # block allows.
    location /api/regenerate {
        # auth_basic "zonelore";
        # auth_basic_user_file /etc/nginx/.htpasswd-zonelore;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No /_next/static block on purpose: Next.js already answers those with
    # `Cache-Control: public, max-age=31536000, immutable`, and adding it here again just
    # emits the header twice.
    location / {
        # auth_basic "zonelore";
        # auth_basic_user_file /etc/nginx/.htpasswd-zonelore;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reuse upstream connections rather than opening one per request.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}

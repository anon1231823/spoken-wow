# What is left of lore.rusty.one once spoken.rusty.one is serving.
#
# The same bargain the voiceover redirect makes, with one extra shape to unpick. Spoken
# Zones builds https://lore.rusty.one/{lang}/r/{mapID}/{slug} -- the language is in the
# address because a report is about the text and narration on screen -- and builds up to
# 0.3.1 sent /r/{mapID}/{slug} with no language at all. Both are in players' hands.
#
# The merged site serves English and takes no language in the path, so both forms fold to
# /zones/r/{mapID}/{slug}. THE LANGUAGE IS DROPPED RATHER THAN CARRIED: there is nowhere
# for it to go yet, and carrying it as a query parameter nothing reads would be pretending
# otherwise. A player reporting a German line reaches the English page for it, which is
# worse than it will be and much better than a 404 -- and the report they file still lands
# in the same triage queue.
#
#   sudo cp deploy/web/nginx-lore-redirect.conf /etc/nginx/sites-available/lore
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lore.rusty.one;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lore.rusty.one;

    ssl_certificate         /etc/letsencrypt/live/lore.rusty.one/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/lore.rusty.one/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lore.rusty.one/chain.pem;
    include                 /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam             /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lore.access.log;
    error_log  /var/log/nginx/lore.error.log;

    # The report link, in both the forms the addon has ever emitted. The language segment
    # is optional in the pattern and discarded in the replacement.
    #
    #   /deDE/r/1411/razor-hill  ->  /zones/r/1411/razor-hill
    #   /r/1411/razor-hill       ->  /zones/r/1411/razor-hill
    #
    # Matched before the bare-language block below, because nginx takes the first regex
    # location that matches and /deDE/r/... matches both.
    #
    # QUOTED, because of the braces. nginx parses the config before it parses the regex, and
    # an unquoted `{2}` closes the directive: this fails `nginx -t` with "missing closing
    # parenthesis", which reads like a bad regex and is not one.
    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?r/(\d+)/([^/]+)/?$" {
        return 301 https://spoken.rusty.one/zones/r/$1/$2;
    }

    # A language's front page -- what the header's language switch linked to, and what
    # anybody who bookmarked the explorer has.
    location ~ "^/[a-z]{2}[A-Z]{2}/?$" {
        return 301 https://spoken.rusty.one/zones;
    }

    location = / {
        return 301 https://spoken.rusty.one/zones;
    }

    # The three pages this site named differently. They are not gone - the merge made them
    # shared, under the quests side's spelling - so a bookmark of one has somewhere exact to
    # land, and sending it to a 404 instead would be throwing away a working address.
    #
    #   /voice, /{lang}/voice          ->  /voices
    #   /{lang}/pronunciation          ->  /lexicon
    #   /feedback, /{lang}/feedback    ->  /reports
    #
    # The language segment is optional and discarded, as it is for the report links above.
    # Quoted for the braces, for the reason that block gives.
    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?voice/?$" {
        return 301 https://spoken.rusty.one/voices;
    }

    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?pronunciation/?$" {
        return 301 https://spoken.rusty.one/lexicon;
    }

    location ~ "^/(?:[a-z]{2}[A-Z]{2}/)?feedback/?$" {
        return 301 https://spoken.rusty.one/reports;
    }

    # Everything else keeps its path, which is the right answer for the pages both sites
    # already spelled the same: /lexicon, /admin, /login, /register, /profile.
    location / {
        return 301 https://spoken.rusty.one$request_uri;
    }
}

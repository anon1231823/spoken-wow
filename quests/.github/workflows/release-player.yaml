name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Rename TOC files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION:1}
          find ./VoiceOverRedux -name "*.toc" -exec sed -i "s/## Version: 0.0.0/## Version: $VERSION/g" {} \;
      # VoiceOverRedux, not AI_VoiceOver: that directory is upstream's code, kept only as a
      # baseline to diff against, and shipping it would release a player nobody here
      # maintains. See CLAUDE.md.
      - name: Copy VoiceOverRedux to release
        run: |
          for client in vanilla tbc wrath blizz; do
            mkdir -p ./release/$client/VoiceOverRedux
            cp -r ./VoiceOverRedux/* ./release/$client/VoiceOverRedux
          done

      # The client picks the .toc matching the folder name, so each zip carries exactly one
      # and it is the one for that client.
      - name: Copy TOC files
        run: |
          cp ./release/vanilla/VoiceOverRedux/VoiceOverRedux_1.12.toc ./release/vanilla/VoiceOverRedux/VoiceOverRedux.toc
          cp ./release/tbc/VoiceOverRedux/VoiceOverRedux_2.4.3.toc ./release/tbc/VoiceOverRedux/VoiceOverRedux.toc
          cp ./release/wrath/VoiceOverRedux/VoiceOverRedux_3.3.5.toc ./release/wrath/VoiceOverRedux/VoiceOverRedux.toc
          cp ./release/blizz/VoiceOverRedux/VoiceOverRedux_Mainline.toc ./release/blizz/VoiceOverRedux/VoiceOverRedux.toc

      - name: Zip each release version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd ./release/vanilla && zip -r ../VoiceOverRedux-WoW_1.12-$VERSION.zip . && cd ../..
          cd ./release/tbc && zip -r ../VoiceOverRedux-WoW_2.4.3-$VERSION.zip . && cd ../..
          cd ./release/wrath && zip -r ../VoiceOverRedux-WoW_3.3.5-$VERSION.zip . && cd ../..
          cd ./release/blizz && zip -r ../VoiceOverRedux-WoW_BlizzClassic-$VERSION.zip . && cd ../..

      - name: Generate release notes
        uses: cuchi/jinja2-action@v1.2.2
        with:
          template: .github/release-template.md
          output_file: release_notes.md
          strict: true
          variables: |
            github_zip_download_vanilla_sounds=https://github.com/${{ github.repository }}/releases/latest/download/VoiceOverReduxAudio.zip
            github_zip_download_blizz=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_BlizzClassic-${{ github.ref_name }}.zip
            github_zip_download_112=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_1.12-${{ github.ref_name }}.zip
            github_zip_download_243=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_2.4.3-${{ github.ref_name }}.zip
            github_zip_download_335=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_3.3.5-${{ github.ref_name }}.zip
            curse_link_blizz=https://www.curseforge.com/wow/addons/voiceover-redux
            curse_link_vanilla_sounds=https://www.curseforge.com/wow/addons/voiceover-redux-audio
            donation_link=https://ko-fi.com/evanpierce
            discord_link=https://discord.gg/VdhUmA8ZCt

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            release/*.zip


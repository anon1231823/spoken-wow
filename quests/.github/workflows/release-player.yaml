name: Release

# Publishes the player addon to a GitHub release, which is the only channel the 1.12, 2.4.3
# and 3.3.5 clients have: CurseForge offers files against Blizzard's game versions, so
# scripts/release.sh uploads the Blizzard zip there and nothing else.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The .toc is the source of the version and the tag has to agree with it. This used to
      # run the other way round - the tag was substituted into every .toc over a placeholder
      # that stopped existing - which meant a tag could name a version the tree never had.
      - name: Check the tag against the TOC
        id: version
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' \
            VoiceOverRedux/VoiceOverRedux.toc | head -1 | tr -d '\r')"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match ## Version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The packaging script and nothing else, so a release zip is the same artifact the
      # author builds locally: which .toc a client gets, and which vendored Ace3 rides with
      # it, are decisions that live in one place.
      - name: Build the zips
        run: ./scripts/package.sh

      - name: Generate release notes
        uses: cuchi/jinja2-action@v1.2.2
        with:
          template: .github/release-template.md
          output_file: release_notes.md
          strict: true
          variables: |
            github_zip_download_blizz=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-${{ steps.version.outputs.version }}.zip
            github_zip_download_112=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_1.12-${{ steps.version.outputs.version }}.zip
            github_zip_download_243=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_2.4.3-${{ steps.version.outputs.version }}.zip
            github_zip_download_335=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VoiceOverRedux-WoW_3.3.5-${{ steps.version.outputs.version }}.zip
            curse_link_blizz=https://www.curseforge.com/wow/addons/voiceover-redux
            curse_link_pack_alliance=https://www.curseforge.com/wow/addons/voiceover-redux-audio-alliance
            curse_link_pack_horde=https://www.curseforge.com/wow/addons/voiceover-redux-audio-horde
            curse_link_pack_shared=https://www.curseforge.com/wow/addons/voiceover-redux-audio-shared-quests
            curse_link_pack_gossip=https://www.curseforge.com/wow/addons/voiceover-redux-audio-gossip
            donation_link=https://ko-fi.com/evanpierce
            discord_link=https://discord.gg/VdhUmA8ZCt

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/*.zip

name: Release

# Publishes the player addon to a GitHub release, which is the only channel the 1.12, 2.4.3
# and 3.3.5 clients have: CurseForge offers files against Blizzard's game versions, so
# scripts/release.sh uploads the Blizzard zip there and nothing else.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The .toc is the source of the version and the tag has to agree with it. This used to
      # run the other way round - the tag was substituted into every .toc over a placeholder
      # that stopped existing - which meant a tag could name a version the tree never had.
      - name: Check the tag against the TOC
        id: version
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' \
            VoiceOverRedux/VoiceOverRedux.toc | head -1 | tr -d '\r')"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match ## Version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The packaging script and nothing else, so a release zip is the same artifact the
      # author builds locally: which .toc a client gets, and which vendored Ace3 rides with
      # it, are decisions that live in one place.
      - name: Build the zips
        run: ./scripts/package.sh

      # Rendered here rather than by cuchi/jinja2-action: that action is a Docker action, so
      # the runner builds its image before any step of this job runs, and its Dockerfile no
      # longer builds - which failed the whole workflow before it reached the first step.
      # Substitution into a fixed template needs no template engine anyway, and this keeps the
      # engine's one useful behaviour: an unfilled placeholder is an error, not empty text.
      - name: Render the release notes
        env:
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          download, version = os.environ["DOWNLOAD"], os.environ["VERSION"]
          variables = {
              "github_zip_download_blizz": f"{download}/VoiceOverRedux-{version}.zip",
              "github_zip_download_112": f"{download}/VoiceOverRedux-WoW_1.12-{version}.zip",
              "github_zip_download_243": f"{download}/VoiceOverRedux-WoW_2.4.3-{version}.zip",
              "github_zip_download_335": f"{download}/VoiceOverRedux-WoW_3.3.5-{version}.zip",
              "curse_link_blizz": "https://www.curseforge.com/wow/addons/voiceover-redux",
              "curse_link_pack_alliance": "https://www.curseforge.com/wow/addons/voiceover-redux-audio-alliance",
              "curse_link_pack_horde": "https://www.curseforge.com/wow/addons/voiceover-redux-audio-horde",
              "curse_link_pack_shared": "https://www.curseforge.com/wow/addons/voiceover-redux-audio-shared-quests",
              "curse_link_pack_gossip": "https://www.curseforge.com/wow/addons/voiceover-redux-audio-gossip",
              "donation_link": "https://ko-fi.com/evanpierce",
              "discord_link": "https://discord.gg/VdhUmA8ZCt",
          }

          with open(".github/release-template.md", encoding="utf-8") as handle:
              template = handle.read()

          missing = []

          def substitute(match):
              name = match.group(1)
              if name not in variables:
                  missing.append(name)
                  return match.group(0)
              return variables[name]

          rendered = re.sub(r"{{\s*([a-z_0-9]+)\s*}}", substitute, template)
          if missing:
              sys.exit(f"release-template.md uses undefined variables: {', '.join(sorted(set(missing)))}")

          with open("release_notes.md", "w", encoding="utf-8") as handle:
              handle.write(rendered)
          PY

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/*.zip

name: Deploy web

on:
  push:
    branches: [master]
    # Addon-only commits should not redeploy the explorer.
    paths:
      - "web/**"
      - "corpus/**"
      - "deploy/**"
      - ".github/workflows/deploy-web.yaml"
  workflow_dispatch:

# Never let two deploys interleave a symlink swap.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # A throwaway database for the build and the smoke test. The droplet's real one is
    # bound to localhost and unreachable from here, which is the point: CI proves the
    # bundle can talk to *a* Postgres with this schema, and never touches production data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voiceover
          POSTGRES_PASSWORD: voiceover
          POSTGRES_DB: voiceover
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://voiceover:voiceover@127.0.0.1:5432/voiceover
      # CI-only, and never used to sign a cookie anyone keeps. The droplet's real secret
      # lives in /srv/voiceover/shared/app.env.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          # The pnpm version comes from "packageManager" in web/package.json. This repo
          # has no root package.json, which is where the action looks by default.
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          # Must match the droplet's Node major. The droplet uses its own system Node
          # (currently 24), so if you upgrade it there, change it here too and redeploy.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The gate. audio.test.ts asserts every file in the store is addressed by some
      # corpus line and range.test.ts covers Safari's bytes=0-1 probe; neither should
      # reach the droplet red.
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Test
        working-directory: web
        run: pnpm test

      # Applied with the same script the droplet uses, so a migration that only works
      # under a hand-run psql fails here instead of mid-deploy.
      - name: Migrate
        run: deploy/bin/migrate.sh "$PWD/web"

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Assemble release
        run: |
          set -euo pipefail
          R=release
          mkdir -p "$R"
          # cp -a, never cp -r: pnpm's node_modules/next is a symlink into .pnpm/, and a
          # dereferencing copy detaches it from its siblings, so the bundle dies at boot
          # with "Cannot find module 'styled-jsx/package.json'". BSD cp -r dereferences.
          cp -a web/.next/standalone/. "$R"/
          # standalone does not include static assets or public/; without this the page
          # renders unstyled. (This project has no public/.)
          cp -a web/.next/static "$R"/.next/static
          # The corpus ships inside the release so a rollback moves data and code together.
          mkdir -p "$R"/corpus
          cp corpus/corpus.json.gz "$R"/corpus/
          # Migrations ship with the release too: activate.sh runs migrate.sh against the
          # release directory, so without this a deploy has nothing to apply.
          cp -a web/migrations "$R"/migrations
          test -f "$R"/server.js
          test -L "$R"/node_modules/next   # symlink survived the copy
          test -f "$R"/migrations/0001_auth.sql
          du -sh "$R"

      # Boot the exact artifact we are about to ship. Catches a broken bundle here rather
      # than after it has replaced a working release on the droplet. No audio store in CI,
      # so readStoreIndex() returns empty and every line reads as a gap - that is fine, we
      # are testing that the server starts and serves, not the contents.
      - name: Smoke test the bundle
        working-directory: release
        env:
          PORT: 3999
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
          VOICEOVER_AUDIO: /nonexistent
          # Better Auth rejects any request whose Origin is not this, so the smoke test
          # below must send exactly this value. Getting it wrong on the droplet is the
          # failure mode that makes every sign-in return "Invalid origin".
          BETTER_AUTH_URL: http://127.0.0.1:3999
        run: |
          set -euo pipefail
          VOICEOVER_CORPUS="$PWD/corpus/corpus.json.gz" node server.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:3999/api/search?q=thrall" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3999/api/search?q=thrall" | grep -q '"npcName":"Thrall"'

          # Auth has to survive the standalone bundle too: pg and better-auth are traced
          # into it, and the schema has to be the one migrate.sh just applied. A registered
          # user must come back as a member - the default role is what everything else gates
          # on.
          signup=$(curl -fsS -X POST "http://127.0.0.1:3999/api/auth/sign-up/email" \
            -H 'Content-Type: application/json' \
            -H "Origin: $BETTER_AUTH_URL" \
            -D headers.txt \
            -d '{"name":"CI","email":"ci-'"$GITHUB_RUN_ID"'@example.com","password":"ci-smoke-password"}')
          echo "$signup" | grep -q '"role":"member"'
          grep -qi '^set-cookie: better-auth.session_token=' headers.txt
          echo "sign-up works against the shipped bundle"
          # The stylesheet must resolve, or .next/static did not make it into the release.
          css=$(curl -fsS http://127.0.0.1:3999/ | grep -o '_next/static/css/[^"]*' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:3999/$css"
          echo "bundle boots and serves"

      - name: Set release name
        run: echo "STAMP=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The key goes to a file rather than into an agent so the workflow controls its exact
      # bytes: a secret pasted through a browser commonly loses its trailing newline or
      # picks up CRLF, and ssh then fails with a bare `error in libcrypto` naming neither
      # the key nor the cause. Both are repaired here; a wrong key cannot be, hence the
      # explicit check.
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$(printf '%s' "$KEY" | tr -d '\r')" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DO_SSH_KEY is not a usable private key. Re-set it from the file so the trailing newline survives: gh secret set DO_SSH_KEY < ~/.ssh/voiceover_deploy - it must be the private key, not the .pub, including its BEGIN/END lines."
            exit 1
          fi
          echo "deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"

      - name: Upload release
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/deploy_key" release/ \
            "$TARGET:/srv/voiceover/releases/$STAMP/"

      - name: Activate
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "/srv/voiceover/bin/activate.sh /srv/voiceover/releases/$STAMP"

      # A bad deploy should heal itself rather than sit broken until someone notices.
      - name: Smoke check, rolling back on failure
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/deploy_key "$TARGET" \
              "curl -fsS --max-time 10 -o /dev/null 'http://127.0.0.1:3000/api/search?q=thrall'"
            then ok=1; break; fi
            echo "attempt $i failed, retrying..."
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::smoke check failed, rolling back"
            ssh -i ~/.ssh/deploy_key "$TARGET" '/srv/voiceover/bin/rollback.sh'
            exit 1
          fi
          echo "smoke check passed"

      - name: Prune old releases
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$TARGET" '/srv/voiceover/bin/prune.sh 5'

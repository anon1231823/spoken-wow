# nginx vhost for the voiceline explorer.
#
# Install alongside your existing sites - this touches nothing else:
#   sudo cp deploy/nginx-voiceover.conf /etc/nginx/sites-available/voiceover
#   sudo ln -s /etc/nginx/sites-available/voiceover /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS (it rewrites this file in place and adds the :443 block):
#   sudo certbot --nginx -d voiceover.rusty.one

server {
    listen 80;
    listen [::]:80;
    server_name voiceover.rusty.one;

    access_log /var/log/nginx/voiceover.access.log;
    error_log  /var/log/nginx/voiceover.error.log;

    # The audio store, split out from / because streaming needs different handling.
    # The app answers Range itself (see web/src/lib/range.ts) and nginx forwards the
    # header untouched, so everything here exists to keep that response byte-exact:
    # Safari opens audio with `Range: bytes=0-1` and refuses a resource that answers 200.
    location /api/audio/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Stream straight through. With buffering on, nginx accumulates the upstream
        # response (spilling to disk past proxy_buffers) before answering, which adds
        # latency to every seek and churns disk for a 1.1 GB store.
        proxy_buffering off;
        proxy_request_buffering off;

        # Never gzip mp3: it is already compressed, so this is pure CPU. It would also
        # put nginx in the business of rewriting a body the Range headers describe.
        gzip off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If you have proxy_cache configured globally, it must not apply here: a cache
        # that is not Range-aware will serve truncated audio.
        proxy_cache off;
    }

    # No /_next/static block on purpose: Next.js already answers those with
    # `Cache-Control: public, max-age=31536000, immutable`, and adding it here again just
    # emits the header twice.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reuse upstream connections rather than opening one per request.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}

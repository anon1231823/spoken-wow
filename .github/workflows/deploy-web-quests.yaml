name: Deploy quests web (frozen)

# FROZEN. voiceover.rusty.one keeps serving the release it has, and nothing on main
# deploys to it any more.
#
# The push trigger is gone rather than narrowed. apps/web-quests became apps/web while the
# two sites are being merged into spoken.rusty.one, so the paths this used to watch now
# name a half-merged app -- and a merge to main would have shipped it onto the live site
# without anyone asking. The guard step below is the second half of that: dispatching this
# from main would build the same thing by hand.
#
# To hotfix the live site before the cutover, dispatch this workflow against the
# `legacy-freeze` tag. GitHub runs the workflow file from the ref it is dispatched with, so
# that run gets the pre-merge tree, the pre-merge paths, and no guard.
#
# It goes away with /srv/voiceover itself, once spoken.rusty.one has been serving long
# enough that rolling back to this one is no longer a plan.

on:
  workflow_dispatch:

# Never let two deploys interleave a symlink swap.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # A throwaway database for the build and the smoke test. The droplet's real one is
    # bound to localhost and unreachable from here, which is the point: CI proves the
    # bundle can talk to *a* Postgres with this schema, and never touches production data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voiceover
          POSTGRES_PASSWORD: voiceover
          POSTGRES_DB: voiceover
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://voiceover:voiceover@127.0.0.1:5432/voiceover
      # CI-only, and never used to sign a cookie anyone keeps. The droplet's real secret
      # lives in /srv/voiceover/shared/app.env.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      # Refuse on main, where the tree no longer builds the site this deploys. Dispatching
      # from `legacy-freeze` runs that ref's copy of this file, which has no such step.
      - name: The voiceover deployment is frozen
        run: |
          echo "voiceover.rusty.one is frozen while the two sites merge into spoken.rusty.one."
          echo "This ref builds apps/web, which is the merged app and not what /srv/voiceover runs."
          echo "To hotfix the live site, dispatch this workflow against the legacy-freeze tag."
          exit 1

      - uses: actions/checkout@v5

      # The pnpm version comes from "packageManager" in the root package.json, which is
      # where the action looks by default.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          # Must match the droplet's Node major. The droplet uses its own system Node
          # (currently 24), so if you upgrade it there, change it here too and redeploy.
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One install for the whole workspace: both apps and the zones pipeline. The zones
      # pipeline needs its own node_modules and used to require a second, npm-managed
      # root package to get one.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      # Applied with the same script the droplet uses, so a migration that only works
      # under a hand-run psql fails here instead of mid-deploy.
      #
      # Before the tests, not after: history.test.ts exercises the version table against a
      # real Postgres, because the ordering it protects - archive the current take before
      # anything overwrites it - is exactly what a mocked database would stop testing.
      - name: Migrate
        run: deploy/quests/bin/migrate.sh "$PWD/apps/web"

      # The gate. audio.test.ts asserts every file in the store is addressed by some
      # corpus line and range.test.ts covers Safari's bytes=0-1 probe; neither should
      # reach the droplet red.
      - name: Test
        working-directory: apps/web
        run: pnpm test

      - name: Build
        working-directory: apps/web
        run: pnpm build

      - name: Assemble release
        run: |
          set -euo pipefail
          R=release
          mkdir -p "$R"
          # cp -a, never cp -r: pnpm's node_modules/next is a symlink into .pnpm/, and a
          # dereferencing copy detaches it from its siblings, so the bundle dies at boot
          # with "Cannot find module 'styled-jsx/package.json'". BSD cp -r dereferences.
          cp -a apps/web/.next/standalone/. "$R"/
          # standalone does not include static assets or public/; without this the page
          # renders unstyled. (This project has no public/.)
          cp -a apps/web/.next/static "$R"/apps/web/.next/static
          # The corpus ships inside the release so a rollback moves data and code together.
          # hiccups.json.gz rides along because it is derived from exactly this corpus, and
          # a glob for the reason the voice/ line below gives: the next file beside it
          # should not depend on anyone remembering this line.
          #
          # Laid out exactly as the repo lays it out, so paths.ts's DATA_ROOT resolves
          # inside the release without an environment variable: standalone chdirs to
          # apps/web/, and DATA_ROOT is two levels up plus pipelines/quests.
          mkdir -p "$R"/pipelines/quests/corpus
          cp pipelines/quests/corpus/*.json.gz "$R"/pipelines/quests/corpus/
          # Same reasoning for how a line is voiced. These are also what the Python CLI
          # reads, so shipping them keeps both sides starting from the same defaults - and
          # without pronunciation.json the app applies no rules and reads "Hm" as letters.
          #
          # A glob rather than a list, so the next file added here ships without anyone having
          # to remember this line - which is how lexicon.json came to be missing back when the
          # lexicon was still a file. It is not one any more: it lives in the database, seeded
          # by migration 0008, so there is nothing lexicon-shaped left to forget.
          mkdir -p "$R"/pipelines/quests/voice
          cp pipelines/quests/voice/*.json "$R"/pipelines/quests/voice/
          # Migrations ship with the release too: activate.sh runs migrate.sh against the
          # release directory, so without this a deploy has nothing to apply.
          cp -a apps/web/migrations "$R"/migrations
          test -f "$R"/apps/web/server.js
          test -L "$R"/apps/web/node_modules/next   # symlink survived the copy
          test -f "$R"/migrations/0001_auth.sql
          test -f "$R"/migrations/0005_voiceline_version_credits.sql
          test -f "$R"/pipelines/quests/voice/generation.json
          test -f "$R"/pipelines/quests/voice/pronunciation.json
          test -f "$R"/migrations/0008_seed_pronunciation_lexicon.sql
          du -sh "$R"

      # Boot the exact artifact we are about to ship. Catches a broken bundle here rather
      # than after it has replaced a working release on the droplet. No audio store in CI,
      # so readStoreIndex() returns empty and every line reads as a gap - that is fine, we
      # are testing that the server starts and serves, not the contents.
      - name: Smoke test the bundle
        working-directory: release
        env:
          PORT: 3999
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
          VOICEOVER_AUDIO: /nonexistent
          # Better Auth rejects any request whose Origin is not this, so the smoke test
          # below must send exactly this value. Getting it wrong on the droplet is the
          # failure mode that makes every sign-in return "Invalid origin".
          BETTER_AUTH_URL: http://127.0.0.1:3999
        run: |
          set -euo pipefail
          VOICEOVER_CORPUS="$PWD/pipelines/quests/corpus/corpus.json.gz" node apps/web/server.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:3999/api/search?q=thrall" && break
            sleep 1
          done
          # Scoped to the NPC on purpose. Results are one flat page of fifty in alphabetical
          # order, and an unscoped "thrall" also matches every line that merely mentions him,
          # which is enough to push Thrall's own lines off page one.
          curl -fsS "http://127.0.0.1:3999/api/search?q=thrall&filter=npc" | grep -q '"npcName":"Thrall"'

          # Auth has to survive the standalone bundle too: pg and better-auth are traced
          # into it, and the schema has to be the one migrate.sh just applied. A registered
          # user must come back as a member - the default role is what everything else gates
          # on.
          signup=$(curl -fsS -X POST "http://127.0.0.1:3999/api/auth/sign-up/email" \
            -H 'Content-Type: application/json' \
            -H "Origin: $BETTER_AUTH_URL" \
            -D headers.txt \
            -d '{"name":"CI","email":"ci-'"$GITHUB_RUN_ID"'@example.com","password":"ci-smoke-password"}')
          echo "$signup" | grep -q '"role":"member"'
          grep -qi '^set-cookie: better-auth.session_token=' headers.txt
          echo "sign-up works against the shipped bundle"
          # The stylesheet must resolve, or .next/static did not make it into the release.
          css=$(curl -fsS http://127.0.0.1:3999/ | grep -o '_next/static/css/[^"]*' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:3999/$css"
          echo "bundle boots and serves"

      - name: Set release name
        run: echo "STAMP=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The key goes to a file rather than into an agent so the workflow controls its exact
      # bytes: a secret pasted through a browser commonly loses its trailing newline or
      # picks up CRLF, and ssh then fails with a bare `error in libcrypto` naming neither
      # the key nor the cause. Both are repaired here; a wrong key cannot be, hence the
      # explicit check.
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$(printf '%s' "$KEY" | tr -d '\r')" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DO_SSH_KEY is not a usable private key. Re-set it from the file so the trailing newline survives: gh secret set DO_SSH_KEY < ~/.ssh/voiceover_deploy - it must be the private key, not the .pub, including its BEGIN/END lines."
            exit 1
          fi
          echo "deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"

      - name: Upload release
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/deploy_key" release/ \
            "$TARGET:/srv/voiceover/releases/$STAMP/"

      - name: Activate
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "/srv/voiceover/bin/activate.sh /srv/voiceover/releases/$STAMP"

      # A bad deploy should heal itself rather than sit broken until someone notices.
      - name: Smoke check, rolling back on failure
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/deploy_key "$TARGET" \
              "curl -fsS --max-time 10 -o /dev/null 'http://127.0.0.1:3000/api/search?q=thrall'"
            then ok=1; break; fi
            echo "attempt $i failed, retrying..."
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::smoke check failed, rolling back"
            ssh -i ~/.ssh/deploy_key "$TARGET" '/srv/voiceover/bin/rollback.sh'
            exit 1
          fi
          echo "smoke check passed"

      - name: Prune old releases
        env:
          TARGET: ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$TARGET" '/srv/voiceover/bin/prune.sh 5'
